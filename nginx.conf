# foxibu.is-a.dev:5555 — vocab-curator HTTPS 진입점
# 인증서는 portfolio 스택(certbot.timer)이 갱신하는 것을 읽기 전용으로 재사용한다.
server {
    listen 443 ssl;
    http2 on;
    server_name foxibu.is-a.dev;

    ssl_certificate     /etc/letsencrypt/live/foxibu.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxibu.is-a.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 6M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Solar Pro 4 생성은 긴 원문일수록 60s 기본 타임아웃을 넘길 수 있어 여유를 둔다
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
